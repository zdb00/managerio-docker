name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      manager_version:
        type: string
        default: ''
      checkout_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Validate files
        run: ./scripts/validate.sh
      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.manager_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${REQUESTED_VERSION:-$(cat MANAGER_VERSION)}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build native image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          load: true
          push: false
          tags: managerio-docker:test
          build-args: |
            MANAGER_VERSION=${{ steps.version.outputs.value }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=manager-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=manager-${{ matrix.arch }}
      - name: Smoke test
        run: ./scripts/smoke-test.sh managerio-docker:test
