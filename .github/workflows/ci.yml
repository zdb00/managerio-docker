name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
    inputs:
      manager_version:
        type: string
        default: ''
      checkout_ref:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.checkout_ref || github.ref }}
      - name: Resolve version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.manager_version }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${REQUESTED_VERSION:-$(cat MANAGER_VERSION)}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "value=$version" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: false
          tags: managerio-docker:ci
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            MANAGER_VERSION=${{ steps.version.outputs.value }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          cache-from: type=gha,scope=manager-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=manager-${{ matrix.arch }}
