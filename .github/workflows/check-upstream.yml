name: Check upstream
on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: managerio-upstream
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.upstream.outputs.latest }}
      newer: ${{ steps.upstream.outputs.newer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check official release
        id: upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/check-upstream.sh
  publish:
    needs: check
    if: needs.check.outputs.newer == 'true'
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      manager_version: ${{ needs.check.outputs.version }}
      update_latest: true
  record-version:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Record successfully published Manager version
        env:
          PUBLISHED_VERSION: ${{ needs.check.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          path = Path('MANAGER_VERSION')
          current = path.read_text().strip()
          published = os.environ['PUBLISHED_VERSION']
          pattern = r'[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'
          if not all(re.fullmatch(pattern, value) for value in (current, published)):
              raise SystemExit('Invalid Manager version')
          if tuple(map(int, published.split('.'))) > tuple(map(int, current.split('.'))):
              path.write_text(published + '\n')
          PY
          if git diff --quiet -- MANAGER_VERSION; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add MANAGER_VERSION
          git commit -m "Record published Manager $PUBLISHED_VERSION"
          git push origin "HEAD:$DEFAULT_BRANCH"
