name: Publish
on:
  workflow_dispatch:
    inputs:
      manager_version:
        description: 'Official four-part Manager version (blank uses MANAGER_VERSION)'
        required: false
        type: string
      update_latest:
        description: 'Promote this version to latest'
        type: boolean
        default: true
  release:
    types: [published]
  workflow_call:
    inputs:
      manager_version:
        required: true
        type: string
      update_latest:
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: managerio-publish
  cancel-in-progress: false
jobs:
  prepare:
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate selected version and release convention
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.manager_version }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          UPDATE_LATEST: ${{ inputs.update_latest }}
        shell: bash
        run: |
          set -Eeuo pipefail
          version=${REQUESTED_VERSION:-$(cat MANAGER_VERSION)}
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$EVENT_NAME" == release ]]; then
            [[ "$RELEASE_TAG" == "v$version" ]] || { echo 'Release tag must equal v + MANAGER_VERSION'; exit 1; }
            UPDATE_LATEST=true
          fi
          {
            echo "version=$version"
            echo "image=ghcr.io/${REPOSITORY_OWNER,,}/managerio-docker"
            echo "latest=$UPDATE_LATEST"
          } >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      manager_version: ${{ needs.prepare.outputs.version }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.latest == 'true' }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.licenses=MIT AND LicenseRef-Manager-Proprietary
      - name: Build and publish both architectures
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          build-args: |
            MANAGER_VERSION=${{ needs.prepare.outputs.version }}
            SOURCE_URL=https://github.com/${{ github.repository }}
          provenance: mode=max
          sbom: true
          cache-from: |
            type=gha,scope=manager-amd64
            type=gha,scope=manager-arm64
            type=gha,scope=manager-publish
          cache-to: type=gha,mode=max,scope=manager-publish
      - name: Attest published image
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ needs.prepare.outputs.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
